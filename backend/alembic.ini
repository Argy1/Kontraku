# Konfigurasi Alembic (alat migrasi skema database).
# Catatan: sqlalchemy.url TIDAK diisi di sini — diambil dari .env lewat alembic/env.py
# supaya password database tidak bocor ke file yang ikut git.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Format nama file migrasi: 2026_08_29_1530-<rev>_<slug>.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
